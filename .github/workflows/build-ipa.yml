name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - run: flutter build ipa --release --no-codesign

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ios/ipa_unsigned/Payload
          cp -r build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app build/ios/ipa_unsigned/Payload/
          cd build/ios/ipa_unsigned
          zip -r ../../../app-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: app-unsigned-ipa
          path: app-unsigned.ipa
